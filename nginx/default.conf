# Platform-level rules added by scenarios (http context: zones, maps).
include /etc/nginx/lab/*.http.conf;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 64m;

    # Platform-level rules added by scenarios (server context: locations).
    include /etc/nginx/lab/*.server.conf;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $lab_https;
        fastcgi_param HTTP_HOST $lab_host;
        fastcgi_pass wordpress:9000;
    }
}

# Lets WordPress know when it is behind an HTTPS proxy (e.g. GitHub Codespaces).
map $http_x_forwarded_proto $lab_https {
    default "";
    https   on;
}

map $http_x_forwarded_host $lab_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}
